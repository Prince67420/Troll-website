<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f1f6f2">
	<title>Bureau Guestbook</title>
	<style>
		:root {
			color-scheme: light;
			font-family: system-ui, sans-serif;
			background: #f1f6f2;
			color: #18372d;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			background: radial-gradient(circle at 12% 18%, #d8eee1 0, transparent 28rem), #f1f6f2;
		}

		main {
			box-sizing: border-box;
			width: min(38rem, calc(100% - 2rem));
			padding: 3rem 1.5rem;
		}

		a {
			color: #176b55;
		}

		.back-link {
			display: inline-block;
			margin-bottom: 2rem;
			font-weight: 650;
		}

		h1 {
			margin: 0;
			font-family: Georgia, serif;
			font-size: clamp(2rem, 7vw, 3.5rem);
			font-weight: 500;
		}

		.intro {
			margin: 0.75rem 0 1.5rem;
			color: #526a5f;
		}

		.guestbook-embed {
			width: 100%;
			height: 75rem;
			border: 0;
			border-radius: 8px;
			background: #fff;
		}

		a:focus-visible {
			outline: 3px solid #18372d;
			outline-offset: 3px;
		}

		.privacy-note {
			color: #526a5f;
			font-size: 0.9rem;
		}

		@media (max-width: 36rem) {
			main {
				width: 100%;
				padding-inline: 1rem;
			}

			.guestbook-embed {
				height: 82rem;
			}
		}
	</style>
</head>
<body>
	<main>
		<a class="back-link" href="index.html">&larr; Back to the Button Boop Bureau</a>
		<h1>Bureau Guestbook</h1>
		<p class="intro">Leave a note for the site owner.</p>
		<iframe
			class="guestbook-embed"
			title="Bureau Guestbook Google Form"
			src="https://docs.google.com/forms/d/e/1FAIpQLSdl8gyqNCfgZBITvFaxucHEQuI4NHU-Ra43rFn57blIrSGezw/viewform?embedded=true"
			loading="eager">
			<p>Your browser cannot display the embedded form. <a href="https://docs.google.com/forms/d/e/1FAIpQLSdl8gyqNCfgZBITvFaxucHEQuI4NHU-Ra43rFn57blIrSGezw/viewform">Open the guestbook form</a>.</p>
		</iframe>
		<p class="privacy-note">Your response is recorded in the form owner's Google Forms account.</p>
		<p><a href="https://docs.google.com/forms/d/e/1FAIpQLSdl8gyqNCfgZBITvFaxucHEQuI4NHU-Ra43rFn57blIrSGezw/viewform" target="_blank" rel="noopener noreferrer">Open the form directly</a></p>
	</main>
</body>
</html>
