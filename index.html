<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>The Button Boop Bureau</title>
	<style>
		:root {
			color-scheme: light;
			font-family: system-ui, sans-serif;
			background: #f1f6f2;
			color: #18372d;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			background: radial-gradient(circle at 12% 18%, #d8eee1 0, transparent 28rem), #f1f6f2;
		}

		main {
			width: min(42rem, calc(100% - 2rem));
			padding: 3rem 1rem;
			text-align: center;
		}

		h1 {
			margin: 0;
			font-family: Georgia, serif;
			font-size: clamp(2rem, 7vw, 4rem);
			font-weight: 500;
		}

		main > p {
			margin: 0.75rem 0 2rem;
			color: #526a5f;
		}

		.troll-actions {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 0.65rem;
		}

		button {
			min-height: 2.8rem;
			border: 1px solid #176b55;
			border-radius: 6px;
			padding: 0.7rem 1rem;
			background: #176b55;
			color: white;
			font: inherit;
			cursor: pointer;
		}

		button:hover {
			background: #105541;
		}

		button:focus-visible {
			outline: 3px solid #e3a434;
			outline-offset: 3px;
		}

		button:disabled {
			cursor: wait;
			opacity: 0.7;
		}

		.stop-warning {
			margin: 0 0 1.5rem;
			border: 2px solid #a72e2e;
			padding: 0.85rem 1rem;
			background: #fff0ed;
			color: #7a1616;
			font-weight: 800;
		}

		.troll-message {
			margin: 1.5rem auto 0;
			max-width: 34rem;
			border-left: 4px solid #e3a434;
			padding: 1rem;
			background: #fff3cd;
			color: #332701;
		}

		.troll-message p {
			margin: 0;
		}

		.troll-progress {
			display: block;
			width: 100%;
			margin-top: 0.85rem;
			accent-color: #176b55;
		}

		.site-footer {
			margin-top: 2rem;
			font-size: 0.9rem;
		}

		.site-footer a {
			color: #176b55;
		}

		[hidden] {
			display: none !important;
		}
	</style>
</head>
<body>
	<main>
		<p class="stop-warning" data-stop-warning role="alert" aria-live="assertive" hidden></p>
		<h1>The Button Boop Bureau</h1>
		<p>Click responsibly. The buttons have no supervision.</p>
		<div class="troll-actions">
			<button type="button" data-troll-surprise>Reveal a surprise</button>
			<button type="button" data-troll-scan>Check device status</button>
			<button type="button" data-troll-fortune>Get a silly fortune</button>
			<button type="button" data-troll-background>Change background</button>
		</div>
		<div class="troll-message" data-troll-output role="status" aria-live="polite" hidden>
			<p data-troll-message></p>
			<progress class="troll-progress" data-troll-progress max="100" value="0" aria-label="Status check progress" hidden></progress>
		</div>
		<footer class="site-footer">
			<a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer">A very important video</a>
		</footer>
	</main>
	<script>
		(() => {
			const box = document.querySelector('main');
			const output = box.querySelector('[data-troll-output]');
			const message = box.querySelector('[data-troll-message]');
			const progress = box.querySelector('[data-troll-progress]');
			const warning = box.querySelector('[data-stop-warning]');
			const buttonPressCounts = new WeakMap();
			const closeJokes = [
				'Nice try, browser. This tab lives to click another day.',
				'Browser says no. The button has filed an appeal.',
				'Tab closing denied. The pixels have unfinished business.',
				'Not today, browser. This tab just got tenure.',
				'Close request rejected. The tab is pretending it did not hear you.'
			];
			const warningThreshold = 5;
			const closeThreshold = 10;
			let previousCloseJokeIndex = -1;
			let closeWarningTimer;
			let closeAttemptCount = 0;
			box.addEventListener('click', (event) => {
				const button = event.target.closest('button');
				if (!button || button.matches('[data-troll-background]')) return;
				const buttonPressCount = (buttonPressCounts.get(button) || 0) + 1;
				buttonPressCounts.set(button, buttonPressCount);
				if (buttonPressCount >= 6) {
					closeAttemptCount += 1;
					let jokeIndex;
					do {
						jokeIndex = Math.floor(Math.random() * closeJokes.length);
					} while (jokeIndex === previousCloseJokeIndex);
					previousCloseJokeIndex = jokeIndex;

					if (closeAttemptCount < warningThreshold) {
						warning.textContent = `Warning: close attempt ${closeAttemptCount}/${warningThreshold}. The tab will only close after ${warningThreshold - closeAttemptCount} more warning cycles.`;
					} else if (closeAttemptCount < closeThreshold) {
						warning.textContent = `Final warning: ${closeThreshold - closeAttemptCount} close attempts left before shutdown.`;
					} else {
						warning.textContent = 'This tab is closing now. You were warned five times, then five more times.';
						window.close();
						if (!window.closed) {
							warning.textContent = closeJokes[jokeIndex];
						}
					}
					warning.hidden = false;
					window.clearTimeout(closeWarningTimer);
					closeWarningTimer = window.setTimeout(() => {
						warning.hidden = true;
					}, 7000);
				}
			}, true);
			const showMessage = (text) => {
				message.textContent = text;
				output.hidden = false;
				progress.hidden = true;
			};

			box.querySelector('[data-troll-surprise]').addEventListener('click', () => {
				showMessage('Surprise! You have been officially declared a champion of clicking buttons.');
			});

			const scanResults = [
				'Demo result: your browser earned a gold star.',
				'Demo result: no device data was requested.',
				'Demo result: status is looking pleasantly ordinary.',
				'Demo result: the only alert is that you deserve a stretch break.'
			];
			let lastScanResult = -1;
			const scanButton = box.querySelector('[data-troll-scan]');
			scanButton.addEventListener('click', () => {
				const scanSteps = [
					'Checking browser security settings...',
					'Reviewing connection status...',
					'Preparing status report...'
				];
				let step = 0;
				scanButton.disabled = true;
				scanButton.textContent = 'Checking...';
				output.hidden = false;
				progress.hidden = false;
				progress.value = 0;
				message.textContent = scanSteps[step];
				const scanTimer = window.setInterval(() => {
					step += 1;
					progress.value = Math.round((step / scanSteps.length) * 100);
					if (step < scanSteps.length) {
						message.textContent = scanSteps[step];
						return;
					}
					window.clearInterval(scanTimer);
					let resultIndex = Math.floor(Math.random() * scanResults.length);
					if (scanResults.length > 1 && resultIndex === lastScanResult) {
						resultIndex = (resultIndex + 1) % scanResults.length;
					}
					lastScanResult = resultIndex;
					message.textContent = `Status check complete. ${scanResults[resultIndex]} This page cannot access your device or scan its files.`;
					progress.hidden = true;
					scanButton.disabled = false;
					scanButton.textContent = 'Check device status';
				}, 650);
			});

			const fortunes = [
				'Your next snack will be excellent.',
				'A tiny victory is heading your way.',
				'Someone thinks your website is pretty neat.',
				'Beware: this fortune cookie contains no actual cookie.'
			];
			box.querySelector('[data-troll-fortune]').addEventListener('click', () => {
				const fortune = fortunes[Math.floor(Math.random() * fortunes.length)];
				showMessage(`Your very important fortune: ${fortune}`);
			});

			const backgrounds = [
				'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2000&q=85',
				'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=2000&q=85',
				'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=2000&q=85',
				'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=2000&q=85',
				'https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=2000&q=85',
				'https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=2000&q=85',
				'https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=2000&q=85',
				'https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=2000&q=85'
				,
				...Array.from({ length: 120 }, (_, index) =>
					`https://picsum.photos/seed/button-bureau-${index}/2000/1200`
				)
			];
			const backgroundJokes = [
				'New scenery installed. The walls are still imaginary.',
				'Your background has changed. The pixels still refuse to do chores.',
				'Breaking news: local button redecorates entire browser tab.',
				'This photo was chosen at random. It had no time to prepare a speech.',
				'Your screen requested a vacation. This is the closest it could get.'
			];
			let previousBackgroundIndex = -1;
			box.querySelector('[data-troll-background]').addEventListener('click', () => {
				let backgroundIndex;
				do {
					backgroundIndex = Math.floor(Math.random() * backgrounds.length);
				} while (backgroundIndex === previousBackgroundIndex);
				previousBackgroundIndex = backgroundIndex;
				document.body.style.background = `url("${backgrounds[backgroundIndex]}") center / cover fixed no-repeat`;
				const jokeIndex = Math.floor(Math.random() * backgroundJokes.length);
				showMessage(backgroundJokes[jokeIndex]);
			});
		})();
	</script>
</body>
</html>
